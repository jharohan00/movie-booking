spring:
  application:
    name: movie-booking

  datasource:
    url: jdbc:postgresql://localhost:5432/moviebooking
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

app:
  jwt:
    secret: ${JWT_SECRET:DUMMY}
    expiration-ms: 86400000  # 24 hours

  booking:
    hold-ttl-minutes: 10
    sweeper-interval-ms: 60000  # every 60 s

  payment:
    mock-failure-rate: 0.0   # set to e.g. 0.1 for 10% random failures in testing

  reminder:
    hours-before-show: 24

logging:
  level:
    com.moviebooking: INFO
    org.hibernate.SQL: WARN

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
